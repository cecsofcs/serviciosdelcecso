<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Librillos CECSo — De estudiantes para estudiantes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">

  <style>
    :root {
        --verde-cecso: #2a9d8f;
        --amarillo-resaltador: #ffea00;
        --naranja-pop: #f4a261;
        --negro-tinta: #264653;
        --bg-hoja: #fdfdfd;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0; 
      background-color: var(--bg-hoja);
      /* Fondo de hoja de cuaderno cuadriculada */
      background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
      background-size: 25px 25px;
      font-family: 'Montserrat', sans-serif;
      color: var(--negro-tinta);
    }

    /* ============ NAVBAR ESTILO "RECORTADO" ============ */
    .navbar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 20px; background: white;
        border-bottom: 5px solid var(--negro-tinta);
        position: sticky; top: 0; z-index: 1000;
    }
    .brand { font-family: 'Permanent Marker', cursive; font-size: 1.8rem; color: var(--negro-tinta); }
    
    .nav-links button {
        background: var(--amarillo-resaltador); border: 3px solid black;
        font-weight: 900; padding: 8px 15px; cursor: pointer;
        box-shadow: 4px 4px 0px black; transition: 0.1s;
    }
    .nav-links button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px black; }

    /* ============ PORTADA FANZINE ============ */
    #seccion-portada { max-width: 800px; margin: 0 auto; padding: 60px 20px; text-align: center; }
    
    .logo-cecso-sketch { 
        font-family: 'Permanent Marker', cursive; 
        font-size: 4rem; color: var(--verde-cecso);
        transform: rotate(-3deg); display: inline-block;
        margin-bottom: 10px;
    }

    h1 { font-size: 3.5rem; font-weight: 900; text-transform: uppercase; line-height: 0.8; margin: 0 0 40px 0; }
    h1 span { background: var(--amarillo-resaltador); padding: 5px 15px; display: inline-block; transform: rotate(1deg); }

    .btn-principal {
        padding: 20px 40px; background: var(--negro-tinta); color: white;
        border: 4px solid black; font-size: 1.5rem; font-weight: 900;
        cursor: pointer; box-shadow: 10px 10px 0px var(--verde-cecso);
        text-transform: uppercase; transition: 0.2s;
    }
    .btn-principal:hover { transform: translate(-4px, -4px); box-shadow: 14px 14px 0px var(--verde-cecso); }

    /* ============ BURBUJAS DE DIÁLOGO (LITERALES) ============ */
    .grid-libros { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }

    .comic-bubble {
        background: white; padding: 30px; border-radius: 40px;
        border: 3px solid var(--negro-tinta);
        position: relative; 
        box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
        display: flex; flex-direction: column; transition: 0.2s;
        height: 100%;
    }
    /* La "colita" del globo de diálogo */
    .comic-bubble::after {
        content: ''; position: absolute; bottom: -18px; left: 45px;
        width: 0; height: 0;
        border-left: 15px solid transparent; border-right: 15px solid transparent;
        border-top: 20px solid var(--negro-tinta);
    }
    .comic-bubble::before {
        content: ''; position: absolute; bottom: -12px; left: 48px;
        width: 0; height: 0; z-index: 1;
        border-left: 12px solid transparent; border-right: 12px solid transparent;
        border-top: 17px solid white;
    }

    .libro-header { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
    .carrera-icon { width: 50px; height: 50px; flex-shrink: 0; filter: grayscale(0.2); }
    .libro-titulo { margin: 0; font-size: 1.2rem; font-weight: 900; color: var(--negro-tinta); line-height: 1.2; }
    
    .btn-add {
        margin-top: auto; width: 100%; padding: 12px; border: 3px solid black;
        background: var(--verde-cecso); color: white; font-weight: 900; cursor: pointer;
        box-shadow: 4px 4px 0px black; text-transform: uppercase;
    }
    .btn-add:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px black; }
    .btn-add.in-cart { background: var(--naranja-pop); }

    /* ============ CARRITO ESTILO "NOTA ADHESIVA" ============ */
    .carrito-sidebar {
        background: #fff9c4; border: 2px solid #fbc02d; padding: 25px; 
        box-shadow: 8px 8px 0px rgba(0,0,0,0.1); transform: rotate(1deg);
    }
    .total-box { font-size: 2.2rem; font-weight: 900; color: var(--negro-tinta); text-align: right; margin: 20px 0; }

    #app-container { display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
    .view-step { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
    .view-step h2 { font-size: 2.5rem; font-weight: 900; margin-bottom: 30px; }

    .btn-carrera {
        background: white; border: 3px solid black; padding: 20px; font-size: 1.2rem;
        font-weight: 900; cursor: pointer; box-shadow: 6px 6px 0px var(--verde-cecso);
        margin-bottom: 15px; width: 100%; max-width: 400px; transition: 0.1s;
    }
    .btn-carrera:hover { background: var(--amarillo-resaltador); }

    @media (max-width: 800px) {
        .main-layout { flex-direction: column; }
        .carrito-sidebar { position: static; order: -1; margin-bottom: 40px; transform: rotate(0); }
    }
  </style>
</head>

<body>

  <nav class="navbar">
      <div class="brand">cecso</div> <div class="nav-links">
          <button onclick="navegar('inicio')">INICIO</button>
          <button onclick="navegar('app')">PEDIR</button>
      </div>
  </nav>

  <section id="seccion-portada">
    <div class="logo-cecso-sketch">cecso</div>
    <h1>Buscador de<br><span>Librillos</span></h1>
    <p style="font-weight: 700; font-size: 1.1rem;">De estudiantes para estudiantes. <br>Elegí tu carrera y armá tu pedido.</p>
    <br>
    <button class="btn-principal" onclick="navegar('app')">ENTRAR AL BUSCADOR</button>
  </section>

  <div id="app-container">
      <div id="step-carrera" class="view-step">
          <h2>¿QUÉ CURSÁS?</h2>
          <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column;">
              <button class="btn-carrera" onclick="seleccionarCarrera('Ciclo Inicial')">Ciclo Inicial</button>
              <button class="btn-carrera" onclick="seleccionarCarrera('Sociología')">Sociología</button>
              <button class="btn-carrera" onclick="seleccionarCarrera('Trabajo Social')">Trabajo Social</button>
              <button class="btn-carrera" onclick="seleccionarCarrera('Ciencia Política')">Ciencia Política</button>
              <button class="btn-carrera" onclick="seleccionarCarrera('Desarrollo')">Desarrollo</button>
          </div>
      </div>

      <div id="step-tipo" class="view-step" style="display:none;">
          <h2 id="txt-carrera-sel" style="background: var(--amarillo-resaltador);"></h2>
          <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column;">
              <button class="btn-carrera" onclick="iniciarCarga('Obligatorias')">OBLIGATORIAS</button>
              <button class="btn-carrera" onclick="iniciarCarga('Optativas')">OPTATIVAS</button>
              <button onclick="navegarApp('step-carrera')" style="margin-top:20px; font-weight:700; cursor:pointer; background:none; border:none; text-decoration:underline;">← Cambiar carrera</button>
          </div>
      </div>

      <div id="step-catalogo" style="display:none;">
          <div style="text-align: center; margin-bottom: 40px;">
              <h2 id="txt-hoja-sel" style="display:inline-block; border-bottom: 5px solid var(--naranja-pop);"></h2>
              <input type="text" id="buscador-librillos" placeholder="🔍 Escribí el nombre de la materia..."/>
              <p id="txt-loading" style="font-weight:900;">Buscando en los archivos...</p>
          </div>

          <div class="main-layout" style="display: flex; gap: 40px; align-items: flex-start;">
              <div class="grid-libros" id="lista-libros" style="flex:2;"></div>
              
              <div class="carrito-sidebar" style="flex:1; position: sticky; top: 100px;">
                  <h3 style="font-family:'Permanent Marker'; font-size:1.8rem; margin:0;">Tu Pedido</h3>
                  <div id="cart-items-container" style="margin: 20px 0;"></div>
                  <div class="total-box" id="display-total">$0</div>
                  <button id="btn-checkout" onclick="finalizar()" style="width:100%; padding:15px; background:black; color:var(--amarillo-resaltador); border:none; font-weight:900; font-size:1.1rem; cursor:pointer;">¡LISTO, PEDIR!</button>
              </div>
          </div>
      </div>
  </div>

  <script>
    // === CONFIGURACIÓN ===
    const API_URL = "PONE_ACA_TU_URL_DE_APPS_SCRIPT"; 

    // Aquí debes poner el enlace directo (clic derecho > copiar dirección de imagen)
    const ICONOS = {
        "Ciclo Inicial": "https://cdn-icons-png.flaticon.com/512/2232/2232688.png",
        "Sociología": "https://cdn-icons-png.flaticon.com/512/2040/2040652.png",
        "Trabajo Social": "https://cdn-icons-png.flaticon.com/512/1256/1256650.png",
        "Ciencia Política": "https://cdn-icons-png.flaticon.com/512/2413/2413004.png",
        "Desarrollo": "https://cdn-icons-png.flaticon.com/512/4230/4230982.png",
        "def": "https://cdn-icons-png.flaticon.com/512/2232/2232688.png"
    };

    // === LÓGICA DEL SISTEMA ===
    let carrito = JSON.parse(localStorage.getItem("cecsocart")) || [];
    let db = [], filtered = [];
    let licActual = "", tipoActual = "";

    function navegar(seccion) {
        const p = document.getElementById('seccion-portada');
        const a = document.getElementById('app-container');
        if(seccion === 'inicio'){
            p.style.display = 'block'; a.style.display = 'none';
        } else {
            p.style.display = 'none'; a.style.display = 'block';
            navegarApp('step-carrera');
        }
    }

    function navegarApp(step) {
        ['step-carrera', 'step-tipo', 'step-catalogo'].forEach(s => {
            document.getElementById(s).style.display = (s === step) ? 'flex' : 'none';
            if(s === 'step-catalogo' && step === s) document.getElementById(s).style.display = 'block';
        });
    }

    function seleccionarCarrera(c) {
        licActual = c;
        document.getElementById('txt-carrera-sel').innerText = c;
        navegarApp('step-tipo');
    }

    function iniciarCarga(t) {
        tipoActual = t;
        const hoja = `${licActual} ${t}`;
        document.getElementById('txt-hoja-sel').innerText = hoja;
        navegarApp('step-catalogo');
        fetchAPI(hoja);
    }

    function fetchAPI(hoja) {
        const loading = document.getElementById('txt-loading');
        loading.style.display = 'block';
        document.getElementById('lista-libros').innerHTML = "";

        fetch(`${API_URL}?action=obtenerCatalogo&licenciatura=${encodeURIComponent(hoja)}`)
            .then(res => res.json())
            .then(data => {
                db = data; filtered = data;
                loading.style.display = 'none';
                renderCatalogo();
            })
            .catch(e => {
                loading.innerText = "Error: ¿Pusiste la URL de la API?";
            });
    }

    function renderCatalogo() {
        const grid = document.getElementById('lista-libros');
        grid.innerHTML = "";
        const iconUrl = ICONOS[licActual] || ICONOS.def;

        filtered.forEach(item => {
            const isAdded = carrito.some(c => c.id === item.id);
            const card = document.createElement('div');
            card.className = 'comic-bubble';
            card.innerHTML = `
                <div class="libro-header">
                    <img src="${iconUrl}" class="carrera-icon">
                    <p class="libro-titulo">${item.titulo}</p>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
                    <p style="font-weight:900; font-size:1.4rem;">$${item.precio}</p>
                    <button class="btn-add ${isAdded ? 'in-cart' : ''}" onclick="toggleCart('${item.id}', '${item.titulo.replace(/'/g,"")}', ${item.precio})">
                        ${isAdded ? '✓' : 'AÑADIR'}
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function toggleCart(id, titulo, precio) {
        const idx = carrito.findIndex(c => c.id === id);
        if(idx === -1) carrito.push({id, titulo, precio});
        else carrito.splice(idx, 1);
        localStorage.setItem("cecsocart", JSON.stringify(carrito));
        renderCatalogo(); renderCarrito();
    }

    function renderCarrito() {
        const container = document.getElementById('cart-items-container');
        container.innerHTML = "";
        let total = 0;
        carrito.forEach((c, i) => {
            total += c.precio;
            container.innerHTML += `<div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:8px; border-bottom:1px solid #ddd;"><span>${c.titulo}</span><button onclick="removeCart(${i})" style="border:none; background:none; cursor:pointer;">❌</button></div>`;
        });
        document.getElementById('display-total').innerText = `$${total}`;
    }

    function removeCart(i) {
        carrito.splice(i, 1);
        localStorage.setItem("cecsocart", JSON.stringify(carrito));
        renderCarrito(); renderCatalogo();
    }

    document.getElementById('buscador-librillos').oninput = (e) => {
        const q = e.target.value.toLowerCase();
        filtered = db.filter(l => l.titulo.toLowerCase().includes(q));
        renderCatalogo();
    };

    function finalizar() {
        if(carrito.length === 0) return alert("¡El pedido está vacío!");
        const titulos = carrito.map(c => c.titulo).join(", ");
        const total = document.getElementById('display-total').innerText.replace("$","");
        const url = "https://docs.google.com/forms/d/e/1FAIpQLSfdrntWehRkIJFXNd4SYQ7dczmur09LZ9ApGFjl5GA0J7wFTQ/viewform?usp=pp_url&entry.539670442=" + encodeURIComponent(titulos) + "&entry.482914514=" + encodeURIComponent(total);
        window.open(url, "_blank");
    }

    window.onload = () => { renderCarrito(); navegar('inicio'); };
  </script>
</body>
</html>
