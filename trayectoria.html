<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Servicios del CECSo — ¡Conseguí tus librillos!</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
        --petroleo: #1b5e63;
        --terracota: #d97d60;
        --crema-papel: #fdfaf6;
        --rosa-suave: #fce4ec;
        --negro: #000000;
        --borde: 4px solid #000000;
        --sombra: 8px 8px 0px #000000;
        --sombra-pet: 6px 6px 0px var(--petroleo);
        --sombra-terra: 6px 6px 0px var(--terracota);
        
        /* Colores de fondo para módulos */
        --fondo-obligatoria: #e8f2f3; 
        --fondo-optativa: #fdf2ef;    
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0; background-color: var(--crema-papel);
      background-image: 
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 25px 25px;
      font-family: 'Inter', sans-serif; color: var(--negro);
    }

    .font-logo { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -1.5px; }

    /* NAVBAR */
    .navbar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 30px; background: white; border-bottom: var(--borde);
        position: sticky; top: 0; z-index: 1000;
    }
    .brand { cursor: pointer; font-size: 1.3rem; color: var(--petroleo); white-space: nowrap; }
    .nav-links { display: flex; gap: 10px; }
    .nav-links button {
        background: var(--rosa-suave); border: 2.5px solid var(--negro); padding: 8px 18px;
        font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0px var(--negro);
        transition: 0.1s; text-transform: uppercase; font-size: 0.75rem;
    }

    /* INICIO */
    #seccion-inicio { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .hero h1 { font-size: clamp(1.8rem, 6.5vw, 4.5rem); color: var(--petroleo); line-height: 1; margin: 0; -webkit-text-stroke: 1px var(--negro); }
    .btn-cta-top {
        display: inline-block; margin: 40px 0; padding: 22px 45px;
        background: var(--terracota); color: white; border: var(--borde);
        font-weight: 900; font-size: 1.4rem; text-transform: uppercase;
        cursor: pointer; box-shadow: var(--sombra); transition: 0.1s;
    }

    /* TRAYECTORIA */
    #seccion-trayectoria { display: none; padding: 40px 20px; max-width: 900px; margin: 0 auto; }
    .panel-zen {
        background: white; border: var(--borde); padding: 30px 20px; border-radius: 15px;
        box-shadow: var(--sombra); margin-bottom: 40px; text-align: center;
        position: sticky; top: 75px; z-index: 100;
    }

    /* MÓDULOS */
    .modulo-box {
        background: white; border: var(--borde); padding: 25px; border-radius: 15px;
        box-shadow: var(--sombra-terra); margin-bottom: 30px;
    }
    .modulo-obligatoria { background-color: var(--fondo-obligatoria); }
    .modulo-optativa { background-color: var(--fondo-optativa); }

    .modulo-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid rgba(0,0,0,0.1); padding-bottom: 10px; margin-bottom: 20px; }
    .modulo-header h3 { margin: 0; font-family: 'Archivo Black'; font-size: 1.4rem; color: var(--petroleo); }
    
    .materia-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 0; border-bottom: 1px dashed rgba(0,0,0,0.1); gap: 15px;
    }
    .btn-estado {
        background: white; border: 2px solid var(--negro); padding: 8px 15px;
        font-weight: 800; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;
        box-shadow: 3px 3px 0px var(--negro); transition: 0.1s; border-radius: 5px;
    }
    .btn-aprobada.activa { background: #d4edda; border-color: #28a745; box-shadow: 3px 3px 0px #28a745; color: #155724; }
    .btn-cursar.activa { background: var(--terracota); border-color: var(--terracota); box-shadow: 3px 3px 0px var(--negro); color: white; }

    .asesoramiento-box {
        background: var(--crema-papel); border: 3px dashed var(--petroleo); padding: 30px;
        text-align: center; border-radius: 15px; margin-top: 50px;
    }

    /* MODALES */
    .modal-overlay { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.6); z-index: 4000; align-items: center; justify-content: center; padding: 20px; 
    }
    .modal-content { 
        background: white; border: var(--borde); border-radius: 15px; padding: 30px; 
        max-width: 500px; width: 100%; box-shadow: var(--sombra); position: relative; max-height: 90vh; overflow-y: auto;
    }

    @media (max-width: 900px) {
        .materia-item { flex-direction: column; align-items: flex-start; }
        .materia-acciones { width: 100%; display: flex; }
        .btn-estado { flex: 1; }
    }
  </style>
</head>

<body>

  <nav class="navbar">
      <div class="brand font-logo" onclick="navegar('inicio')">Servicios del CECSo</div>
      <div class="nav-links">
          <button onclick="navegar('inicio')">Inicio</button>
          <button onclick="navegar('app')">Buscador</button>
          <button onclick="navegar('trayectoria')">Mi Trayectoria</button>
      </div>
  </nav>

  <section id="seccion-inicio">
    <div class="hero">
        <h1 class="font-logo">Servicios del CECSo</h1>
        <button class="btn-cta-top" onclick="navegar('app')">Conseguí tus librillos</button>
    </div>
  </section>

  <section id="seccion-trayectoria">
      <div class="trayectoria-header">
          <h2>Mi Trayectoria</h2>
          <p>Marcá lo que ya hiciste y armá tu plan de cursada.</p>
          <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
               <button class="btn-choice" style="padding: 10px 20px;" onclick="cargarPlan('ciclo_inicial')">Ciclo Inicial</button>
               <button class="btn-choice" style="padding: 10px 20px;" onclick="cargarPlan('ciencia_politica')">Ciencia Política</button>
               <button class="btn-choice" style="padding: 10px 20px;" onclick="cargarPlan('desarrollo')">Desarrollo</button>
               <button class="btn-choice" style="padding: 10px 20px;" onclick="cargarPlan('sociologia')">Sociología</button>
               <button class="btn-choice" style="padding: 10px 20px;" onclick="cargarPlan('trabajo_social')">Trabajo Social</button>
          </div>
      </div>

      <div id="trayectoria-content" style="display: none; margin-top: 40px;">
          <div class="panel-zen">
              <h3 id="titulo-carrera-activa" class="titulo-zen">Ciclo Inicial</h3>
              <div class="contador-box">
                  <span id="texto-progreso-global" class="numero-zen">0 / 0 cr.</span>
              </div>
          </div>

          <div id="modulos-container"></div>

          <div class="asesoramiento-box">
              <h3>¿Dudas con tu trayectoria?</h3>
              <p style="font-weight: 600; font-size: 0.9rem; margin-bottom: 20px;">
                  Si te queda alguna duda, podes plantearla por acá y capaz te podemos ayudar.
              </p>
              <input type="text" id="asesor_nombre" placeholder="Tu nombre (opcional)" style="width:100%; margin-bottom:10px; padding:10px;">
              <textarea id="asesor_consulta" placeholder="Escribí tu consulta acá..." style="width:100%; height:100px; padding:10px;"></textarea>
              <button class="btn-cta-top" style="padding:15px; width:100%;" onclick="alert('Próximamente disponible')">Enviar consulta</button>
          </div>
      </div>
  </section>

  <div id="modal-optativas" class="modal-overlay">
      <div class="modal-content">
          <button class="modal-close" onclick="document.getElementById('modal-optativas').style.display='none'">✕</button>
          <h3 id="titulo-modal-optativas" style="font-family:'Archivo Black'; color:var(--petroleo);">Optativas</h3>
          <div id="lista-optativas-modal"></div>
      </div>
  </div>

  <script>
    let planesEstudio = null;
    let estadoTrayectoria = JSON.parse(localStorage.getItem("cecso_trayectoria")) || {};

    window.onload = () => {
        fetch("TU_URL_DE_APPS_SCRIPT?action=obtenerMallas")
            .then(res => res.json())
            .then(data => { planesEstudio = data; });
    };

    function navegar(sec) {
        document.getElementById('seccion-inicio').style.display = (sec==='inicio'?'block':'none');
        document.getElementById('seccion-trayectoria').style.display = (sec==='trayectoria'?'block':'none');
    }

    function cargarPlan(id) {
        document.getElementById('trayectoria-content').style.display = 'block';
        if(!estadoTrayectoria[id]) estadoTrayectoria[id] = { aprobadas: [], creditos_optativos: {} };
        renderPlan(id);
    }

    function renderPlan(idCarrera) {
        const plan = planesEstudio[idCarrera];
        const container = document.getElementById('modulos-container');
        container.innerHTML = '';
        let totalAprobados = 0;
        let moiRenderizado = false;

        document.getElementById('titulo-carrera-activa').innerText = plan.nombre;

        plan.modulos.forEach(modulo => {
            // Inyección MOI antes del Trabajo Final
            if (idCarrera === 'desarrollo' && modulo.nombre.toLowerCase().includes('trabajo final') && !moiRenderizado) {
                container.innerHTML += `<div class="modulo-box" style="border: 3px solid var(--petroleo)"><h3>🎯 Configuración de MOI</h3><p>Aquí va el selector de MOI...</p></div>`;
                moiRenderizado = true;
            }

            const nMod = modulo.nombre.toLowerCase();
            let claseColor = (nMod.includes('oblig') || nMod.includes('core')) ? 'modulo-obligatoria' : 'modulo-optativa';

            let materiasHtml = '';
            modulo.materias.forEach(mat => {
                const isAprobada = estadoTrayectoria[idCarrera].aprobadas.includes(mat.id);
                if(isAprobada) totalAprobados += mat.creditos;

                materiasHtml += `
                    <div class="materia-item">
                        <div class="materia-info">
                            <h4 class="materia-nombre">${mat.nombre}</h4>
                            <p class="materia-meta">${mat.creditos} créditos</p>
                            ${mat.es_bolsa_creditos ? `<button class="btn-estado" onclick="abrirModalOptativas('${mat.id}')">¿Y cuáles puedo hacer?</button>` : ''}
                        </div>
                        <div class="materia-acciones">
                            <button class="btn-estado btn-aprobada ${isAprobada?'activa':''}" onclick="toggleMateria('${idCarrera}','${mat.id}')">Aprobada</button>
                        </div>
                    </div>`;
            });

            container.innerHTML += `
                <div class="modulo-box ${claseColor}">
                    <div class="modulo-header"><h3>${modulo.nombre}</h3></div>
                    ${materiasHtml}
                </div>`;
        });

        document.getElementById('texto-progreso-global').innerText = `${totalAprobados} / ${plan.creditos_totales_requeridos} cr.`;
    }

    function toggleMateria(carrera, id) {
        const idx = estadoTrayectoria[carrera].aprobadas.indexOf(id);
        if(idx === -1) estadoTrayectoria[carrera].aprobadas.push(id);
        else estadoTrayectoria[carrera].aprobadas.splice(idx, 1);
        localStorage.setItem("cecso_trayectoria", JSON.stringify(estadoTrayectoria));
        renderPlan(carrera);
    }

    function abrirModalOptativas(idBolsa) {
        document.getElementById('modal-optativas').style.display = 'flex';
        // Aquí llamarías a una función del Apps Script que busque en la hoja "catalogo_optativas"
    }
  </script>
</body>
</html>
