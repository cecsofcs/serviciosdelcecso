<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Servicios del CECSo — Mi Trayectoria</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
        --petroleo: #1b5e63;
        --terracota: #d97d60;
        --crema-papel: #fdfaf6;
        --rosa-suave: #fce4ec;
        --negro: #000000;
        --borde: 4px solid #000000;
        --sombra: 8px 8px 0px #000000;
        --sombra-terra: 6px 6px 0px var(--terracota);
        --fondo-obligatoria: #e8f2f3; 
        --fondo-optativa: #fdf2ef;    
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0; background-color: var(--crema-papel);
      background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 25px 25px;
      font-family: 'Inter', sans-serif; color: var(--negro);
    }

    .font-logo { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -1.5px; }

    .navbar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 30px; background: white; border-bottom: var(--borde);
        position: sticky; top: 0; z-index: 1000;
    }

    .nav-links button {
        background: var(--rosa-suave); border: 2.5px solid var(--negro); padding: 8px 18px;
        font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0px var(--negro);
        text-transform: uppercase; font-size: 0.75rem; transition: 0.1s;
    }

    #seccion-trayectoria { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

    .panel-zen {
        background: white; border: var(--borde); padding: 30px; border-radius: 15px;
        box-shadow: var(--sombra); margin-bottom: 40px; text-align: center;
        position: sticky; top: 75px; z-index: 100;
    }

    .modulo-box {
        background: white; border: var(--borde); padding: 25px; border-radius: 15px;
        box-shadow: var(--sombra-terra); margin-bottom: 30px;
    }
    .modulo-obligatoria { background-color: var(--fondo-obligatoria); }
    .modulo-optativa { background-color: var(--fondo-optativa); }

    .materia-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 0; border-bottom: 1px dashed rgba(0,0,0,0.1); gap: 15px;
    }

    .btn-estado {
        background: white; border: 2px solid var(--negro); padding: 8px 15px;
        font-weight: 800; cursor: pointer; font-size: 0.75rem; box-shadow: 3px 3px 0px var(--negro);
    }
    .btn-aprobada.activa { background: #d4edda; color: #155724; border-color: #28a745; }

    .tag-horario {
        background: #f0f4f4; padding: 8px; border-radius: 4px; font-size: 0.8rem;
        border-left: 4px solid var(--petroleo); margin-top: 8px; display: block; line-height: 1.4;
    }

    .modal-overlay { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.7); z-index: 4000; align-items: center; justify-content: center;
    }
    .modal-content { 
        background: white; border: var(--borde); border-radius: 15px; padding: 30px; 
        max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative;
    }

    .btn-choice {
        background: white; border: var(--borde); padding: 12px; font-weight: 800;
        cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <nav class="navbar">
      <div class="brand font-logo">CECSo Trayectoria</div>
      <div class="nav-links">
          <button onclick="location.reload()">Reiniciar</button>
      </div>
  </nav>

  <section id="seccion-trayectoria">
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px;">
          <button class="btn-choice" onclick="cargarPlan('ciclo_inicial')">Ciclo Inicial</button>
          <button class="btn-choice" onclick="cargarPlan('ciencia_politica')">Ciencia Política</button>
          <button class="btn-choice" onclick="cargarPlan('desarrollo')">Desarrollo</button>
          <button class="btn-choice" onclick="cargarPlan('sociologia')">Sociología</button>
          <button class="btn-choice" onclick="cargarPlan('trabajo_social')">Trabajo Social</button>
      </div>

      <div id="trayectoria-content" style="display:none;">
          <div class="panel-zen">
              <h3 id="titulo-carrera-activa" class="font-logo" style="margin:0; color:var(--petroleo);"></h3>
              <span id="texto-progreso-global" class="font-logo" style="font-size:1.4rem;">0 / 360 cr.</span>
          </div>
          
          <div id="modulos-container"></div>

          <div class="modulo-box" style="border: 3px dashed var(--petroleo); text-align:center;">
              <h3 class="font-logo">¿Dudas?</h3>
              <p>Si te queda alguna duda, podes plantearla por acá y capaz te podemos ayudar.</p>
              <textarea id="consulta_text" placeholder="Escribí tu duda..." style="width:100%; height:80px; padding:10px; margin-bottom:10px; border:2px solid #000;"></textarea>
              <button class="btn-estado" style="width:100%; padding:15px;" onclick="alert('Consulta recibida (Simulado)')">Enviar Consulta</button>
          </div>
      </div>
  </section>

  <div id="modal-optativas" class="modal-overlay">
      <div class="modal-content">
          <button style="position:absolute; top:10px; right:15px; border:none; background:none; font-size:1.5rem; cursor:pointer;" onclick="cerrarModal()">✕</button>
          <h3 class="font-logo" style="color:var(--petroleo); margin-top:0;">Optativas Disponibles</h3>
          <div id="lista-optativas-modal"></div>
      </div>
  </div>

  <script>
    const API_URL = "TU_URL_DE_IMPLEMENTACION_AQUI"; 
    let planesEstudio = null;
    let estadoTrayectoria = JSON.parse(localStorage.getItem("cecso_trayectoria")) || {};

    // Carga inicial de datos
    fetch(API_URL + "?action=obtenerMallas")
        .then(res => res.json())
        .then(data => { planesEstudio = data; });

    function cargarPlan(id) {
        document.getElementById('trayectoria-content').style.display = 'block';
        if(!estadoTrayectoria[id]) estadoTrayectoria[id] = { aprobadas: [] };
        renderPlan(id);
    }

    function renderPlan(idCarrera) {
        const plan = planesEstudio[idCarrera];
        const container = document.getElementById('modulos-container');
        container.innerHTML = '';
        let totalAprobados = 0;

        document.getElementById('titulo-carrera-activa').innerText = plan.nombre;

        plan.modulos.forEach(modulo => {
            const nMod = modulo.nombre.toLowerCase();
            let claseColor = (nMod.includes('oblig') || nMod.includes('core')) ? 'modulo-obligatoria' : 'modulo-optativa';

            let materiasHtml = '';
            modulo.materias.forEach(mat => {
                const isAprobada = estadoTrayectoria[idCarrera].aprobadas.includes(mat.id);
                if(isAprobada) totalAprobados += mat.creditos;

                materiasHtml += `
                    <div class="materia-item">
                        <div style="flex:1">
                            <h4 style="margin:0; font-size:1rem;">${mat.nombre}</h4>
                            <p style="margin:4px 0; font-size:0.8rem; color:#666;">${mat.creditos} cr.</p>
                            ${mat.es_bolsa_creditos ? `<button class="btn-estado" style="padding:4px 8px; font-size:0.65rem;" onclick="abrirModal('${mat.id}')">¿Y cuáles puedo hacer?</button>` : ''}
                        </div>
                        <button class="btn-estado btn-aprobada ${isAprobada?'activa':''}" onclick="toggleMat('${idCarrera}','${mat.id}')">
                            ${isAprobada ? '✓' : 'Aprobada'}
                        </button>
                    </div>`;
            });

            container.innerHTML += `<div class="modulo-box ${claseColor}"><h3 class="font-logo" style="font-size:1.1rem; border-bottom:2px solid #000; padding-bottom:5px;">${modulo.nombre}</h3>${materiasHtml}</div>`;
        });
        document.getElementById('texto-progreso-global').innerText = `${totalAprobados} / 360 cr.`;
    }

    function toggleMat(carrera, id) {
        let list = estadoTrayectoria[carrera].aprobadas;
        const idx = list.indexOf(id);
        if(idx === -1) list.push(id); else list.splice(idx, 1);
        localStorage.setItem("cecso_trayectoria", JSON.stringify(estadoTrayectoria));
        renderPlan(carrera);
    }

    function abrirModal(idBolsa) {
        document.getElementById('modal-optativas').style.display = 'flex';
        const lista = document.getElementById('lista-optativas-modal');
        lista.innerHTML = '<p>Buscando en el catálogo...</p>';

        fetch(`${API_URL}?action=obtenerOptativas&bolsa=${idBolsa}`)
            .then(res => res.json())
            .then(data => {
                lista.innerHTML = '';
                if(data.length === 0) { lista.innerHTML = '<p>No hay materias cargadas aún.</p>'; return; }
                data.forEach(opt => {
                    lista.innerHTML += `
                        <div style="padding:15px 0; border-bottom:1px solid #eee;">
                            <h4 style="margin:0; color:var(--petroleo);">${opt.nombre}</h4>
                            <p style="margin:5px 0; font-weight:bold;">${opt.creditos} cr.</p>
                            ${opt.horario ? `<span class="tag-horario"><strong>Horarios:</strong><br>${opt.horario}</span>` : ''}
                            ${opt.link ? `<a href="${opt.link}" target="_blank" style="display:inline-block; margin-top:10px; color:var(--terracota); font-weight:bold;">Ver Programa ↗</a>` : ''}
                        </div>`;
                });
            });
    }

    function cerrarModal() { document.getElementById('modal-optativas').style.display = 'none'; }
  </script>
</body>
</html>
